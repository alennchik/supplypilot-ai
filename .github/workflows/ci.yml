name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    env:
      MPLBACKEND: Agg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: bash .github/scripts/annotate-failure.sh python -m pip install -r requirements.txt

      - name: Run Ruff
        run: python -m ruff check --output-format=github .

      - name: Run Pytest
        run: bash .github/scripts/annotate-failure.sh python -m pytest -q

  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bash ../.github/scripts/annotate-failure.sh npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: bash ../.github/scripts/annotate-failure.sh npm test

      - name: Build
        run: bash ../.github/scripts/annotate-failure.sh npm run build
